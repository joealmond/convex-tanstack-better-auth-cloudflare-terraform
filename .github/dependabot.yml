version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - dependencies
    open-pull-requests-limit: 10
    # These versions currently violate peers used by this starter. Revisit
    # with the corresponding adapter/toolchain migration.
    ignore:
      - dependency-name: better-auth
        versions: ['>=1.7.0']
      - dependency-name: typescript
        versions: ['>=7.0.0']
      - dependency-name: vitest
        versions: ['>=5.0.0']
      - dependency-name: '@vitest/coverage-v8'
        versions: ['>=5.0.0']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      dev-dependencies:
        dependency-type: 'development'
      production-dependencies:
        dependency-type: 'production'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'ci'
      include: 'scope'
