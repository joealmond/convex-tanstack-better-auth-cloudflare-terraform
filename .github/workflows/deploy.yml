name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CONVEX_HOSTING: ${{ vars.CONVEX_HOSTING || 'cloud' }}

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Resolve deployment target before any cloud mutation
        run: node scripts/resolve-deploy-target.mjs
        env:
          APP_URL_PREVIEW: ${{ vars.APP_URL_PREVIEW }}
          APP_URL_PROD: ${{ vars.APP_URL_PROD }}
          CLOUDFLARE_WORKER_NAME_PREVIEW: ${{ vars.CLOUDFLARE_WORKER_NAME_PREVIEW }}
          CLOUDFLARE_WORKER_NAME_PROD: ${{ vars.CLOUDFLARE_WORKER_NAME_PROD }}
          CLOUDFLARE_CUSTOM_DOMAIN_PREVIEW: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN_PREVIEW }}
          CLOUDFLARE_CUSTOM_DOMAIN_PROD: ${{ vars.CLOUDFLARE_CUSTOM_DOMAIN_PROD }}
          VITE_CONVEX_URL_PREVIEW: ${{ secrets.VITE_CONVEX_URL_PREVIEW }}
          VITE_CONVEX_URL_PROD: ${{ secrets.VITE_CONVEX_URL_PROD }}
          VITE_CONVEX_SITE_URL_PREVIEW: ${{ secrets.VITE_CONVEX_SITE_URL_PREVIEW }}
          VITE_CONVEX_SITE_URL_PROD: ${{ secrets.VITE_CONVEX_SITE_URL_PROD }}
          CONVEX_DEPLOY_KEY_PREVIEW: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
          CONVEX_DEPLOY_KEY_PROD: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
          CONVEX_URL_PREVIEW: ${{ secrets.CONVEX_URL_PREVIEW }}
          CONVEX_URL_PROD: ${{ secrets.CONVEX_URL_PROD }}
          CONVEX_ADMIN_KEY_PREVIEW: ${{ secrets.CONVEX_ADMIN_KEY_PREVIEW }}
          CONVEX_ADMIN_KEY_PROD: ${{ secrets.CONVEX_ADMIN_KEY_PROD }}
          CONVEX_DEPLOYMENT_PREVIEW: ${{ secrets.CONVEX_DEPLOYMENT_PREVIEW }}
          CONVEX_DEPLOYMENT_PROD: ${{ secrets.CONVEX_DEPLOYMENT_PROD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install locked dependencies
        run: npm ci

      - name: Detect authentication provider
        id: auth
        run: |
          provider=$(node -p "require('./package.json').convexkit?.auth || 'better-auth'")
          echo "provider=$provider" >> "$GITHUB_OUTPUT"

      - name: Check Convex runtime imports
        run: npm run check:convex-imports

      - name: Validate application before any deployment
        run: npm run format:check && npm run lint -- --max-warnings=0 && npm run test && npm run test:infra && npm run check:convex-imports && npm run typecheck && npm audit --audit-level=low

      - name: Preflight deployment configuration
        run: npm run preflight:deploy -- --environment "${ENVIRONMENT}"
        env:
          REQUIRE_APP_URL: 'true'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_ISSUER_DOMAIN: ${{ vars.CLERK_JWT_ISSUER_DOMAIN }}

      - name: Set deployed app URL on Convex
        run: |
          if [ "$CONVEX_HOSTING" = 'self-hosted' ]; then
            npx convex env set SITE_URL "${APP_URL}" --url "${CONVEX_URL}"
          else
            npx convex env set SITE_URL "${APP_URL}"
          fi
          if [ "$AUTH_PROVIDER" = 'clerk' ]; then
            if [ "$CONVEX_HOSTING" = 'self-hosted' ]; then
              npx convex env set CLERK_JWT_ISSUER_DOMAIN "$CLERK_JWT_ISSUER_DOMAIN" --url "$CONVEX_URL"
            else
              npx convex env set CLERK_JWT_ISSUER_DOMAIN "$CLERK_JWT_ISSUER_DOMAIN"
            fi
          fi
        env:
          AUTH_PROVIDER: ${{ steps.auth.outputs.provider }}
          CLERK_JWT_ISSUER_DOMAIN: ${{ vars.CLERK_JWT_ISSUER_DOMAIN }}

      - name: Deploy Convex cloud production
        if: env.CONVEX_HOSTING == 'cloud' && env.ENVIRONMENT == 'production'
        run: npx convex deploy --yes

      - name: Deploy Convex cloud preview
        if: env.CONVEX_HOSTING == 'cloud' && env.ENVIRONMENT == 'preview'
        run: npx convex dev --once --typecheck=disable

      - name: Deploy Convex self-hosted production
        if: env.CONVEX_HOSTING == 'self-hosted' && env.ENVIRONMENT == 'production'
        run: npx convex deploy --yes --url "${CONVEX_URL}"

      - name: Deploy Convex self-hosted preview
        if: env.CONVEX_HOSTING == 'self-hosted' && env.ENVIRONMENT == 'preview'
        run: npx convex dev --once --typecheck=disable --url "${CONVEX_URL}"

      - name: Build production Worker
        if: env.ENVIRONMENT == 'production'
        run: npm run build:prod
        env:
          VITE_APP_ENV: production
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}

      - name: Build preview Worker
        if: env.ENVIRONMENT == 'preview'
        run: npm run build:preview
        env:
          VITE_APP_ENV: preview
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}

      - name: Generate Wrangler deploy config
        run: npm run sync:wrangler-config
        env:
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}

      - name: Validate configured Worker origin
        run: node scripts/verify-worker-origin.mjs --preflight

      - name: Deploy Cloudflare Worker
        id: worker-deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json

      - name: Install Clerk Worker secret
        if: steps.auth.outputs.provider == 'clerk'
        run: printf %s "$CLERK_SECRET_KEY" | npx wrangler secret put CLERK_SECRET_KEY --config dist/server/wrangler.json
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployed Worker origin
        run: node scripts/verify-worker-origin.mjs
        env:
          WRANGLER_OUTPUT: ${{ steps.worker-deploy.outputs.command-output }}
          WRANGLER_DEPLOYMENT_URL: ${{ steps.worker-deploy.outputs.deployment-url }}

      - name: Run read-only deployment smoke test
        id: smoke
        run: npm run smoke:preview -- --url "${APP_URL}" --convex-site-url "${VITE_CONVEX_SITE_URL}"

      - name: Write release record
        if: always()
        run: npm run release:record
        env:
          RELEASE_STATUS: ${{ job.status }}
          SMOKE_STATUS: ${{ steps.smoke.outcome }}
          DEPLOY_ENVIRONMENT: ${{ env.ENVIRONMENT }}
          DEPLOYED_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          WRANGLER_OUTPUT: ${{ steps.worker-deploy.outputs.command-output }}

      - name: Deployment summary
        run: |
          echo "## Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ env.ENVIRONMENT }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Convex hosting: ${{ env.CONVEX_HOSTING }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
