name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
  cancel-in-progress: false

env:
  ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  CONVEX_HOSTING: ${{ vars.CONVEX_HOSTING || 'cloud' }}
  APP_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && vars.APP_URL_PROD || github.event_name == 'workflow_dispatch' && vars.APP_URL_PREVIEW || vars.APP_URL_PREVIEW }}
  CLOUDFLARE_WORKER_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.environment == 'production' && vars.CLOUDFLARE_WORKER_NAME_PROD || github.event_name == 'workflow_dispatch' && vars.CLOUDFLARE_WORKER_NAME_PREVIEW || vars.CLOUDFLARE_WORKER_NAME_PREVIEW }}

jobs:
  deploy:
    name: Deploy ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'preview' }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AUTO_DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Convex runtime imports
        run: npm run check:convex-imports

      - name: Preflight deployment configuration
        run: npm run preflight:deploy -- --environment "${ENVIRONMENT}"
        env:
          APP_URL: ${{ env.APP_URL }}
          VITE_CONVEX_URL: ${{ env.ENVIRONMENT == 'production' && secrets.VITE_CONVEX_URL_PROD || secrets.VITE_CONVEX_URL_PREVIEW }}
          VITE_CONVEX_SITE_URL: ${{ env.ENVIRONMENT == 'production' && secrets.VITE_CONVEX_SITE_URL_PROD || secrets.VITE_CONVEX_SITE_URL_PREVIEW }}
          OTHER_CONVEX_URL: ${{ env.ENVIRONMENT == 'production' && secrets.VITE_CONVEX_URL_PREVIEW || secrets.VITE_CONVEX_URL_PROD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ env.CLOUDFLARE_WORKER_NAME }}
          CONVEX_DEPLOY_KEY: ${{ env.ENVIRONMENT == 'production' && secrets.CONVEX_DEPLOY_KEY_PROD || secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
          CONVEX_URL: ${{ env.CONVEX_HOSTING == 'self-hosted' && (env.ENVIRONMENT == 'production' && secrets.CONVEX_URL_PROD || secrets.CONVEX_URL_PREVIEW) || '' }}
          CONVEX_ADMIN_KEY: ${{ env.CONVEX_HOSTING == 'self-hosted' && (env.ENVIRONMENT == 'production' && secrets.CONVEX_ADMIN_KEY_PROD || secrets.CONVEX_ADMIN_KEY_PREVIEW) || '' }}

      - name: Deploy Convex cloud production
        if: env.CONVEX_HOSTING == 'cloud' && env.ENVIRONMENT == 'production'
        run: npx convex deploy --yes
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}

      - name: Deploy Convex cloud preview
        if: env.CONVEX_HOSTING == 'cloud' && env.ENVIRONMENT == 'preview'
        run: npx convex dev --once --typecheck=disable
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PREVIEW }}

      - name: Deploy Convex self-hosted production
        if: env.CONVEX_HOSTING == 'self-hosted' && env.ENVIRONMENT == 'production'
        run: npx convex deploy --yes --url "${{ secrets.CONVEX_URL_PROD }}"
        env:
          CONVEX_ADMIN_KEY: ${{ secrets.CONVEX_ADMIN_KEY_PROD }}

      - name: Deploy Convex self-hosted preview
        if: env.CONVEX_HOSTING == 'self-hosted' && env.ENVIRONMENT == 'preview'
        run: npx convex dev --once --typecheck=disable --url "${{ secrets.CONVEX_URL_PREVIEW }}"
        env:
          CONVEX_ADMIN_KEY: ${{ secrets.CONVEX_ADMIN_KEY_PREVIEW }}

      - name: Build production Worker
        if: env.ENVIRONMENT == 'production'
        run: npm run build:prod
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL_PROD }}
          VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL_PROD }}
          VITE_APP_ENV: production

      - name: Build preview Worker
        if: env.ENVIRONMENT == 'preview'
        run: npm run build:preview
        env:
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL_PREVIEW }}
          VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL_PREVIEW }}
          VITE_APP_ENV: preview

      - name: Generate Wrangler deploy config
        run: npm run sync:wrangler-config
        env:
          CLOUDFLARE_CUSTOM_DOMAIN: ${{ env.ENVIRONMENT == 'production' && vars.CLOUDFLARE_CUSTOM_DOMAIN_PROD || vars.CLOUDFLARE_CUSTOM_DOMAIN_PREVIEW }}
          CLOUDFLARE_WORKER_NAME: ${{ env.CLOUDFLARE_WORKER_NAME }}

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config dist/server/wrangler.json

      - name: Set deployed app URL on Convex
        run: |
          if [ "$CONVEX_HOSTING" = 'self-hosted' ]; then
            npx convex env set SITE_URL "${APP_URL}" --url "${CONVEX_URL}"
          else
            npx convex env set SITE_URL "${APP_URL}"
          fi
        env:
          CONVEX_DEPLOY_KEY: ${{ env.ENVIRONMENT == 'production' && secrets.CONVEX_DEPLOY_KEY_PROD || secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
          CONVEX_ADMIN_KEY: ${{ env.ENVIRONMENT == 'production' && secrets.CONVEX_ADMIN_KEY_PROD || secrets.CONVEX_ADMIN_KEY_PREVIEW }}
          CONVEX_URL: ${{ env.ENVIRONMENT == 'production' && secrets.CONVEX_URL_PROD || secrets.CONVEX_URL_PREVIEW }}

      - name: Run read-only deployment smoke test
        run: npm run smoke:preview -- --url "${APP_URL}" --convex-site-url "${VITE_CONVEX_SITE_URL}"
        env:
          VITE_CONVEX_SITE_URL: ${{ env.ENVIRONMENT == 'production' && secrets.VITE_CONVEX_SITE_URL_PROD || secrets.VITE_CONVEX_SITE_URL_PREVIEW }}

      - name: Write release record
        run: npm run release:record
        env:
          DEPLOY_ENVIRONMENT: ${{ env.ENVIRONMENT }}
          APP_URL: ${{ env.APP_URL }}
          VITE_CONVEX_URL: ${{ env.ENVIRONMENT == 'production' && secrets.VITE_CONVEX_URL_PROD || secrets.VITE_CONVEX_URL_PREVIEW }}
          CONVEX_DEPLOYMENT: ${{ env.ENVIRONMENT == 'production' && secrets.CONVEX_DEPLOYMENT_PROD || secrets.CONVEX_DEPLOYMENT_PREVIEW }}
          CLOUDFLARE_WORKER_NAME: ${{ env.CLOUDFLARE_WORKER_NAME }}
          WORKER_VERSION_ID: unavailable

      - name: Deployment summary
        run: |
          echo "## Deployment complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ env.ENVIRONMENT }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Convex hosting: ${{ env.CONVEX_HOSTING }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_STEP_SUMMARY"
