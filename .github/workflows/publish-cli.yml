name: Publish CLI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing create-convexkit-vX.Y.Z release tag to publish'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-create-convexkit
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.NPM_PUBLISH_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'create-convexkit-v'))
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Verify matching immutable template release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const { version } = JSON.parse(readFileSync('packages/create-convexkit/package.json', 'utf8'))
          const tag = `create-convexkit-v${version}`
          if (process.env.RELEASE_TAG !== tag) throw new Error(`Expected release tag ${tag}`)
          const tagged = execFileSync('git', ['rev-parse', `refs/tags/${tag}^{commit}`], { encoding: 'utf8' }).trim()
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          if (tagged !== head) throw new Error('Publish checkout does not match the template tag')
          JS

      - name: Validate the default generated application
        run: node scripts/validate-scaffold.mjs better-auth cloudflare all

      - name: Verify package contents
        working-directory: packages/create-convexkit
        run: npm pack --dry-run

      - name: Publish create-convexkit
        working-directory: packages/create-convexkit
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
