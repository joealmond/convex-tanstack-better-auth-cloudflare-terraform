name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  VITE_CONVEX_URL: https://example.convex.cloud
  VITE_CONVEX_SITE_URL: https://example.convex.site
  VITE_APP_ENV: preview

jobs:
  validate:
    name: Format, lint, test, typecheck, audit, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.1

      - name: Install locked dependencies
        run: npm ci

      - name: Verify generated route tree is current
        run: |
          npm run generate:routes
          git diff --exit-code -- src/routeTree.gen.ts

      - name: Verify generated Worker types are current
        run: |
          npm run cf-typegen
          git diff --exit-code -- worker-configuration.d.ts

      - name: Check formatting
        run: npm run format:check

      - name: Lint without warnings
        run: npm run lint -- --max-warnings=0

      - name: Test with coverage gates
        run: npm run test:coverage

      - name: Test create-convexkit composition
        run: npm run test:cli

      - name: Test build and runtime guardrails
        run: npm run test:guardrails && npm run check:convex-imports

      - name: Test setup wizard
        run: npm run test:setup

      - name: Typecheck
        run: npm run typecheck

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Validate Terraform
        working-directory: infrastructure
        run: |
          terraform fmt -check
          terraform init -backend=false -lockfile=readonly
          terraform validate

      - name: Build preview bundle
        run: npm run build:preview

      - name: Build documentation site
        run: npm run docs:build

      - name: Verify CLI package contents
        working-directory: packages/create-convexkit
        run: npm pack --dry-run

      - name: Validate generated Worker bundle
        run: |
          npm run sync:wrangler-config
          npx wrangler deploy --dry-run --config dist/server/wrangler.json --outdir /tmp/convexkit-worker

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public browser smoke tests
        run: npm run test:e2e:public

      - name: Verify generated app authentication with a disposable local backend
        run: npm run test:e2e:local-auth

      - name: Print local authentication failure logs
        if: failure()
        run: find /tmp -maxdepth 2 -path '/tmp/convexkit-auth-*/*.log' -exec tail -n 80 {} +

  generated-apps:
    name: Generated ${{ matrix.preset }} / ${{ matrix.auth }} / ${{ matrix.deploy }} / ${{ matrix.examples }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        preset: [personal]
        auth: [better-auth, clerk]
        deploy: [cloudflare, vercel, netlify]
        examples: [all, none]
        include:
          - { auth: better-auth, deploy: cloudflare, examples: chat }
          - { auth: better-auth, deploy: cloudflare, examples: files }
          - { auth: better-auth, deploy: cloudflare, examples: admin }
          - { auth: better-auth, deploy: cloudflare, examples: forms }
          - { auth: better-auth, deploy: cloudflare, examples: todos }
          - { auth: better-auth, deploy: cloudflare, examples: ai }
          - { auth: better-auth, deploy: cloudflare, examples: billing }
          - { auth: better-auth, deploy: cloudflare, examples: email }
          - { preset: team-saas, auth: better-auth, deploy: cloudflare, examples: none }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install, lint, test, typecheck, build, and audit generated app
        run: node scripts/validate-scaffold.mjs '${{ matrix.auth }}' '${{ matrix.deploy }}' '${{ matrix.examples }}' '${{ matrix.preset }}'
      - name: Print failure logs
        if: failure()
        run: find /tmp -maxdepth 2 -path '/tmp/convexkit-validate-*/*.log' -exec tail -n 80 {} +
